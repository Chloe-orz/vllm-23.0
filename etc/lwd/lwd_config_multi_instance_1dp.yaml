# CONFIGURATION VALIDATION ONLY: one edge machine, two cloud machines.
# Two logical edge instances share rank 0; world counts unique ranks (17).
# Explicit links are one-to-one, not a full mesh. No API routing is executed.
# Placeholder addresses: this file is not an NPU deployment configuration.
# Formal deployments keep the filename etc/lwd/lwd_config.yaml.
deployment:
  mode: 0
  scene: edge_share
  hccl_world_size: 17
  edges_num: 2
  clouds_num: 2

feature_ctrl:
  enable_early_recv: false
  enable_scramble: false

edges:
  - id: 0
    dp:
      - dp_idx: 0
        addr: 10.0.0.1
        ranks: [0]
  - id: 1
    dp:
      - dp_idx: 0
        addr: 10.0.0.1
        ranks: [0]

clouds:
  - id: 0
    dp:
      - dp_idx: 0
        addr: 10.1.0.1
        ranks: [1, 2, 3, 4, 5, 6, 7, 8]
        ctrl_port: 5550
  - id: 1
    dp:
      - dp_idx: 0
        addr: 10.1.0.2
        ranks: [9, 10, 11, 12, 13, 14, 15, 16]
        ctrl_port: 5550

instance_links:
  - {edge: 0, cloud: 0}
  - {edge: 1, cloud: 1}
