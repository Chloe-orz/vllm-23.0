# Qwen3.8: single instance, one DP, edge TP=1 / cloud TP=8, no-PP.
# Addresses and control port match qwen3.8edge.sh / qwen3.8cloud.sh.
# Deploy identical contents to BOTH hosts at:
# /vllm-workspace/vllm/etc/lwd/qwen3.8_1dp.yaml
# Physical NPU IDs are chosen by ASCEND_RT_VISIBLE_DEVICES in each script;
# the ranks below are logical global ranks, not physical device IDs.
# Keep VLLM_ASCEND_LWD_POST_OUT_PORT=6454 on BOTH sides.
# TCPStore: edge 76.76.26.18:29600 (not the old --master-port 37964).

deployment:
  mode: 0
  scene: single_instance
  hccl_world_size: 9
  edges_num: 1
  clouds_num: 1

feature_ctrl:
  enable_early_recv: false
  enable_scramble: false

edges:
  - id: 0
    dp:
      - dp_idx: 0
        addr: 76.76.26.18
        ranks: [0]

clouds:
  - id: 0
    dp:
      - dp_idx: 0
        addr: 76.76.26.234
        ranks: [1, 2, 3, 4, 5, 6, 7, 8]
        ctrl_port: 6453

instance_links:
  - {edge: 0, cloud: 0}
