# =============================================================================
# LWD prefill_only 拓扑 · 场景 lwd_cluster · 由 tools/gen_lwd_topology.py 生成
# -----------------------------------------------------------------------------
#   scene        = lwd_cluster(机器 2 边 × 2 云,配对规则:全连接)
#   world        = 18       dp 数 = 1(边机 1 卡 / 云机 8 卡,
#                               dp 只切分/共享本机卡,不新增 rank)
#   控制面       云 dp ctrl_port: c0.dp0=5550 c1.dp0=5550
#               (同设备多 dp 错开 = port_base+dp_idx,异设备可重新从 5550 开始)
#   生成命令     --scene lwd_cluster --edge-machines 10.0.0.1,10.0.0.2 --cloud-machines 10.1.0.1,10.1.0.2 --dp 1,2 -o etc/lwd/examples/s4_lwd_cluster.yaml
#   校验         生成器已按 LwdTopology.from_dict 全量校验(结构/rank 铺满/
#               端口错开/配对一致);两侧使用内容必须完全一致
# =============================================================================
deployment:
  mode: 0
  scene: lwd_cluster
  hccl_world_size: 18
  edges_num: 2
  clouds_num: 2
feature_ctrl:
  enable_early_recv: false
  enable_scramble: false
edges:
- id: 0
  dp:
  - dp_idx: 0
    addr: 10.0.0.1
    ranks:
    - 0
- id: 1
  dp:
  - dp_idx: 0
    addr: 10.0.0.2
    ranks:
    - 1
clouds:
- id: 0
  dp:
  - dp_idx: 0
    addr: 10.1.0.1
    ranks:
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    - 9
    ctrl_port: 5550
- id: 1
  dp:
  - dp_idx: 0
    addr: 10.1.0.2
    ranks:
    - 10
    - 11
    - 12
    - 13
    - 14
    - 15
    - 16
    - 17
    ctrl_port: 5550
instance_links:
- edge: 0
  cloud: 0
- edge: 0
  cloud: 1
- edge: 1
  cloud: 0
- edge: 1
  cloud: 1
